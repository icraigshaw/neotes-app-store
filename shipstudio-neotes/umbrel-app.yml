manifestVersion: 1
id: shipstudio-neotes
category: files
name: Neotes
version: "0.10.0"
tagline: Write, manage and publish notes
description: >-
  A notetaking and journalling app with a publishing pipeline.


  Sheets are written in Markdown and organised in a library tree. Internal links
  between sheets are stored as stable IDs, so retitling or re-slugging a sheet
  never breaks a link — on publish they resolve to the target's public URL, and
  old URLs keep redirecting.


  Bulk operations (publish, unpublish, find-and-replace across many sheets) all
  run as plan-then-apply, with a one-click undo for the whole batch.


  Media is curated in Eagle and copied into Neotes at publish time by a small
  bridge agent, so published pages never depend on a desktop being awake.
developer: Craig Shaw
website: https://github.com/icraigshaw/neotes-app-store
dependencies: []
repo: https://github.com/icraigshaw/neotes-app-store
support: https://github.com/icraigshaw/neotes-app-store/issues
port: 3000
# Served from the public app store repo. PNG, not SVG: raw.githubusercontent.com
# sends SVG as text/plain, which a browser will not render as an image.
icon: https://raw.githubusercontent.com/icraigshaw/neotes-app-store/main/shipstudio-neotes/icon.png
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Longform video on Bunny Stream. With MEDIA_VIDEO_BACKEND set to bunny, an
  imported video uploads to Bunny in the background and plays from Bunny's CDN
  once encoded, instead of streaming through your home connection. Videos
  imported earlier can be moved across from the Media page, which also shows
  each video's upload and encoding progress. Firefox and other browsers
  without built-in HLS now play these streams too. Also: the Commonplace icon
  in browser tabs and on iOS home screens.
submitter: Craig Shaw
submission: https://github.com/icraigshaw/neotes-app-store

environment:
  - name: NEOTES_SITE_URL
    services: ["web"]
    default: "http://umbrel.local:3000"
    note: >-
      Public origin of the published site. Set this to your Cloudflare Tunnel
      hostname, e.g. https://notes.example.com, or canonical URLs, Open Graph
      tags and feeds will all point at the wrong place.

  - name: ADMIN_AUTH_MODE
    services: ["web"]
    default: "none"
    options: ["none", "cf-access"]
    note: >-
      none leaves the editor unauthenticated and is for local testing only.
      cf-access trusts Cloudflare Access in front of /admin. Switch to it only
      once the Access policy is live, or the editor is exposed to the internet.

  - name: EAGLE_BRIDGE_TOKEN
    services: ["web"]
    default: "change-me-in-production"
    note: >-
      Shared secret the Eagle bridge uses to upload media. Generate one with
      openssl rand -hex 24. The app refuses to start in cf-access mode while
      this is still the shipped default.

  - name: MEDIA_VIDEO_BACKEND
    services: ["web"]
    default: "local"
    options: ["local", "bunny"]
    note: >-
      local serves video from this Umbrel through the tunnel, which is fine for
      short clips. bunny uploads each imported video to Bunny Stream in the
      background and plays it from Bunny's CDN — what you want for anything
      longform. Videos already imported can be moved from the Media page.

  - name: BUNNY_STREAM_LIBRARY_ID
    services: ["web"]
    default: ""
    note: Required when MEDIA_VIDEO_BACKEND is bunny.

  - name: BUNNY_STREAM_API_KEY
    services: ["web"]
    default: ""
    note: Required when MEDIA_VIDEO_BACKEND is bunny.

  - name: BUNNY_STREAM_CDN_HOSTNAME
    services: ["web"]
    default: ""
    note: >-
      The library's CDN hostname, e.g. vz-abc123.b-cdn.net (Bunny Stream →
      your library → API). A pasted https:// URL is fine too.

  - name: CF_ACCESS_TEAM_DOMAIN
    services: ["web"]
    default: ""
    note: >-
      Your Zero Trust team domain, e.g. myteam.cloudflareaccess.com (the bare
      team name works too). Required when ADMIN_AUTH_MODE is cf-access: without
      it Access tokens cannot be verified and the editor stays locked.

  - name: CF_ACCESS_AUD
    services: ["web"]
    default: ""
    note: >-
      Application Audience (AUD) tag from the Access application. Found under
      Access controls > Applications > your app > Overview. Required when
      ADMIN_AUTH_MODE is cf-access.

  - name: EAGLE_LIBRARY_PATH
    services: ["web"]
    default: ""
    note: >-
      Optional. Leave empty — the app finds libraries under /storage and you
      pick one in the Eagle page, which needs no restart. Set this only to pin
      a specific path; it then overrides the in-app choice.

folderAccess:
  - id: eagle-library
    name: Eagle library
    note: >-
      Choose the folder holding your Eagle library — either the .library folder
      itself or a parent of it. Neotes reads it read-only to generate web
      versions of the images and video you publish, and never writes to it.
    mounts:
      - service: web
        targetPath: /storage
        readOnly: true
